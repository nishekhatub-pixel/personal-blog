# Copy this file to /etc/nginx/sites-available/r7-blog only after checking
# existing server blocks. Replace blog.example.com before enabling it.
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    client_max_body_size 105m;
    client_body_timeout 300s;

    # Temporary work files are never public.
    location ^~ /uploads/temp/ {
        return 404;
    }

    location ~ ^/uploads/(?:.*/)?\. {
        deny all;
    }

    # Uploaded files live outside the application release directory.
    location /uploads/ {
        alias /var/www/r7-blog-storage/;
        autoindex off;
        disable_symlinks on;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}

# Certbot will add the HTTPS server block after DNS points to this server:
# sudo certbot --nginx -d blog.example.com
